<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings - Gold Loan Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="hdr"></header>

<main>
  <div class="card">
    <h2>Shop details (printed on bills)</h2>
    <form id="shopForm">
      <div class="grid">
        <div><label>Shop name *</label><input name="shop_name" required maxlength="100"></div>
        <div><label>Phone</label><input name="shop_phone" maxlength="50"></div>
        <div><label>Licence no.</label><input name="license_no" maxlength="80"></div>
        <div><label>Default interest (% per month)</label><input name="default_rate" type="number" step="0.01" min="0.01" required></div>
        <div class="full"><label>Address</label><input name="shop_address" maxlength="300"></div>
        <div class="full"><label>Terms printed on the bill</label><textarea name="terms" rows="3" maxlength="1500"></textarea></div>
        <div class="full"><label style="display:flex;gap:8px;align-items:center;color:inherit">
          <input type="checkbox" name="deduct_upfront" style="width:auto">
          Deduct one month's interest up front on new bills (default; can be changed per bill)</label></div>
      </div>
      <p><button class="btn" type="submit">Save settings</button></p>
    </form>
  </div>

  <div class="card">
    <h2>Change password</h2>
    <form id="pwForm">
      <div class="grid">
        <div><label>Current password</label><input name="current" type="password" required autocomplete="current-password"></div>
        <div><label>New password (min 8 characters)</label><input name="next" type="password" required minlength="8" autocomplete="new-password"></div>
      </div>
      <p><button class="btn" type="submit">Change password</button></p>
    </form>
  </div>

  <div class="card">
    <h2>Backup</h2>
    <p class="note">Your data is one file: <b>data/goldloan.db</b> inside the program folder. A copy is also saved automatically once a day in <b>data/backups</b> (last 14 days kept). Download a backup and keep it on a pen drive or in the cloud.</p>
    <a class="btn" style="text-decoration:none;display:inline-block" href="/api/backup">Download backup now</a>
  </div>
</main>

<script src="app.js"></script>
<script>
(async () => {
  if (!(await initPage('settings'))) return;
  const s = await api('/api/settings');
  const f = $('shopForm');
  ['shop_name', 'shop_phone', 'license_no', 'default_rate', 'shop_address', 'terms'].forEach(k => f[k].value = s[k] || '');
  f.deduct_upfront.checked = s.deduct_upfront !== '0';

  f.onsubmit = async e => {
    e.preventDefault();
    try {
      const b = Object.fromEntries(new FormData(f));
      b.deduct_upfront = f.deduct_upfront.checked ? '1' : '0';
      await api('/api/settings', 'PUT', b);
      toast('Settings saved');
    } catch (err) { toast(err.message, true); }
  };
  $('pwForm').onsubmit = async e => {
    e.preventDefault();
    try {
      await api('/api/auth/password', 'POST', Object.fromEntries(new FormData(e.target)));
      e.target.reset();
      toast('Password changed');
    } catch (err) { toast(err.message, true); }
  };
})();
</script>
</body>
</html>
