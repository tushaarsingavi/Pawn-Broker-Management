<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Print</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Arial,Helvetica,sans-serif;color:#000;margin:0;background:#eee}
  .bar{background:#8a6508;color:#fff;padding:10px 20px;display:flex;gap:12px;align-items:center}
  .bar button{padding:7px 16px;border:0;border-radius:5px;cursor:pointer;font-size:14px}
  .page{background:#fff;max-width:760px;margin:16px auto;padding:28px 34px;border:1px solid #ccc}
  .shop{text-align:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
  .shop h1{margin:0;font-size:22px;letter-spacing:.5px}
  .shop div{font-size:13px;margin-top:2px}
  .title{text-align:center;font-weight:700;font-size:16px;margin:10px 0 14px;text-transform:uppercase;letter-spacing:1px}
  .meta{display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px}
  table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
  td,th{border:1px solid #444;padding:6px 8px;text-align:left;vertical-align:top}
  th{background:#f2f2f2;font-size:13px}
  td.r,th.r{text-align:right}
  .lbl{width:34%;background:#f7f7f7;font-weight:600}
  .terms{font-size:12px;margin-top:12px;border-top:1px dashed #666;padding-top:8px;white-space:pre-wrap}
  .sign{display:flex;justify-content:space-between;margin-top:46px;font-size:13px}
  .sign div{border-top:1px solid #000;padding-top:4px;min-width:190px;text-align:center}
  .total td{font-weight:700;background:#f2f2f2}
  h3{font-size:14px;margin:14px 0 4px}
  @media print{
    body{background:#fff}
    .bar{display:none}
    .page{border:0;margin:0;max-width:none;padding:10mm 12mm}
  }
</style>
</head>
<body>
<div class="bar"><button onclick="window.print()">Print</button><span id="barmsg">Loading...</span></div>
<div class="page" id="page"></div>

<script src="app.js"></script>
<script>
const qs = new URLSearchParams(location.search);
const type = qs.get('type'), id = qs.get('id');

function shopHead(s) {
  return `<div class="shop"><h1>${esc(s.shop_name)}</h1>
    ${s.shop_address ? `<div>${esc(s.shop_address)}</div>` : ''}
    <div>${s.shop_phone ? 'Phone: ' + esc(s.shop_phone) : ''}${s.shop_phone && s.license_no ? ' &nbsp;|&nbsp; ' : ''}${s.license_no ? 'Licence No: ' + esc(s.license_no) : ''}</div></div>`;
}
function sign(a, b) { return `<div class="sign"><div>${a}</div><div>${b}</div></div>`; }

function loanBill(s, l) {
  const net = l.amount - l.upfront;
  return shopHead(s) + `
  <div class="title">Gold Loan Bill</div>
  <div class="meta"><span><b>Bill No:</b> ${esc(l.bill_no)}</span><span><b>Date:</b> ${fmtDate(l.date)}</span></div>
  <table>
    <tr><td class="lbl">Customer</td><td>${esc(l.customer_name)}</td></tr>
    <tr><td class="lbl">Phone</td><td>${esc(l.customer_phone)}</td></tr>
    ${l.customer_address ? `<tr><td class="lbl">Address</td><td>${esc(l.customer_address)}</td></tr>` : ''}
    <tr><td class="lbl">Item pledged</td><td>${esc(l.item)}</td></tr>
    <tr><td class="lbl">Weight / Purity</td><td>${l.weight} g &nbsp;/&nbsp; ${esc(l.purity)}</td></tr>
    <tr><td class="lbl">Loan amount</td><td>${inr(l.amount)}</td></tr>
    <tr><td class="lbl">Interest rate</td><td>${l.rate}% per month</td></tr>
    ${l.upfront > 0 ? `<tr><td class="lbl">Less: one month's interest</td><td>${inr(l.upfront)}</td></tr>` : ''}
    <tr class="total"><td class="lbl">Amount paid to customer</td><td>${inr(net)}</td></tr>
    ${l.remarks ? `<tr><td class="lbl">Remarks</td><td>${esc(l.remarks)}</td></tr>` : ''}
  </table>
  <div class="terms"><b>Terms:</b> ${esc(s.terms)}</div>
  ${sign('Customer signature', 'For ' + esc(s.shop_name))}`;
}

function receipt(s, d) {
  const { payment: p, loan: l, calc: c } = d;
  return shopHead(s) + `
  <div class="title">${p.is_settlement ? 'Release / Settlement Receipt' : 'Payment Receipt'}</div>
  <div class="meta"><span><b>Receipt No:</b> ${p.id}</span><span><b>Date:</b> ${fmtDate(p.date)}</span></div>
  <table>
    <tr><td class="lbl">Bill No</td><td>${esc(l.bill_no)} (dated ${fmtDate(l.date)})</td></tr>
    <tr><td class="lbl">Customer</td><td>${esc(l.customer_name)} · ${esc(l.customer_phone)}</td></tr>
    <tr><td class="lbl">Item</td><td>${esc(l.item)} · ${l.weight} g · ${esc(l.purity)}</td></tr>
    <tr class="total"><td class="lbl">Received towards ${p.kind}</td><td>${inr(p.amount)}</td></tr>
    ${p.note ? `<tr><td class="lbl">Note</td><td>${esc(p.note)}</td></tr>` : ''}
  </table>
  <h3>Position after this payment (as on ${fmtDate(p.date)})</h3>
  <table>
    <tr><td class="lbl">Principal outstanding</td><td>${inr(c.principal)}</td></tr>
    <tr><td class="lbl">Interest due</td><td>${c.interestDue < 0 ? inr(0) + ' (paid ' + inr(-c.interestDue) + ' in advance)' : inr(c.interestDue)}</td></tr>
    <tr class="total"><td class="lbl">Total balance</td><td>${inr(c.totalDue)}</td></tr>
  </table>
  ${l.status === 'Released' && p.is_settlement ? '<p style="font-weight:700;text-align:center;margin-top:14px">ITEM RELEASED TO CUSTOMER</p>' : ''}
  ${sign('Customer signature', 'For ' + esc(s.shop_name))}`;
}

function statement(s, d) {
  const { loan: l, payments: ps, calc: c } = d;
  return shopHead(s) + `
  <div class="title">Loan Statement</div>
  <div class="meta"><span><b>Bill No:</b> ${esc(l.bill_no)}</span><span><b>As on:</b> ${fmtDate(c.asOf)}</span></div>
  <table>
    <tr><td class="lbl">Customer</td><td>${esc(l.customer_name)} · ${esc(l.customer_phone)}</td></tr>
    <tr><td class="lbl">Item</td><td>${esc(l.item)} · ${l.weight} g · ${esc(l.purity)}</td></tr>
    <tr><td class="lbl">Loan amount / date</td><td>${inr(l.amount)} on ${fmtDate(l.date)}</td></tr>
    <tr><td class="lbl">Rate</td><td>${l.rate}% per month${l.upfront > 0 ? ' · ' + inr(l.upfront) + ' deducted up front' : ''}</td></tr>
    <tr><td class="lbl">Status</td><td>${l.status === 'Active' ? 'Item with us' : 'Released on ' + fmtDate(l.released_date)}</td></tr>
  </table>
  <h3>Payments</h3>
  <table><tr><th>Date</th><th>Towards</th><th class="r">Amount</th><th>Note</th></tr>
    ${l.upfront > 0 ? `<tr><td>${fmtDate(l.date)}</td><td>Interest</td><td class="r">${inr(l.upfront)}</td><td>Deducted up front</td></tr>` : ''}
    ${ps.map(p => `<tr><td>${fmtDate(p.date)}</td><td>${p.kind === 'interest' ? 'Interest' : 'Principal'}</td><td class="r">${inr(p.amount)}</td><td>${esc(p.note)}</td></tr>`).join('')}
  </table>
  <h3>Interest (${c.monthsCharged} month${c.monthsCharged > 1 ? 's' : ''} charged)</h3>
  <table><tr><th>Month</th><th>Period</th><th class="r">Principal</th><th class="r">Interest</th></tr>
    ${c.ledger.map(r => `<tr><td>${r.month}</td><td>${fmtDate(r.from)} – ${fmtDate(r.to)}</td><td class="r">${inr(r.principalAtStart)}</td>
      <td class="r">${inr(r.interest)}${r.capitalized ? '<br><small>' + inr(r.capitalized) + ' added to principal</small>' : ''}</td></tr>`).join('')}
  </table>
  <table>
    <tr><td class="lbl">Interest accrued</td><td>${inr(c.interestAccrued)}</td></tr>
    <tr><td class="lbl">Interest paid (incl. up front)</td><td>${inr(c.interestPaid)}</td></tr>
    <tr><td class="lbl">Principal now</td><td>${inr(c.principal)}</td></tr>
    <tr><td class="lbl">Interest ${c.interestDue < 0 ? 'paid in advance' : 'due'}</td><td>${inr(Math.abs(c.interestDue))}</td></tr>
    <tr class="total"><td class="lbl">${l.status === 'Active' ? 'Total payable' : 'Balance'}</td><td>${inr(c.totalDue)}</td></tr>
  </table>`;
}

(async () => {
  try {
    const st = await fetch('/api/auth/status').then(r => r.json());
    if (!st.loggedIn) return (location.href = '/login.html');
    const s = await api('/api/settings');
    let html;
    if (type === 'receipt') html = receipt(s, await api('/api/payments/' + encodeURIComponent(id)));
    else {
      const d = await api('/api/loans/' + encodeURIComponent(id));
      html = type === 'statement' ? statement(s, d) : loanBill(s, d.loan);
    }
    $('page').innerHTML = html;
    $('barmsg').textContent = 'Check the preview, then click Print (choose A4 or A5).';
    document.title = type + ' ' + id;
  } catch (err) {
    $('page').innerHTML = '<p>' + esc(err.message) + '</p>';
    $('barmsg').textContent = '';
  }
})();
</script>
</body>
</html>
